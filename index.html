<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArQbit Technologies Pvt. Ltd. — Coming Soon</title>
    <meta name="description" content="ArQbit Technologies is launching soon. We're currently working on our website." />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <style>
        /* CSS Variables */
        :root {
            --bg-primary: #F7F6F2;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-navy: #0f172a;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
        }

        /* Resets & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100svh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            line-height: 1.2;
            color: var(--accent-navy);
        }

        /* Background Effects */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.6;
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        .glow-1 {
            top: -10%;
            left: -10%;
            width: 60vw;
            height: 60vh;
            background: radial-gradient(circle, rgba(40, 209, 155, 0.08), transparent 70%);
        }

        .glow-2 {
            bottom: -20%;
            right: -10%;
            width: 70vw;
            height: 70vh;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.08), transparent 70%);
            animation-delay: -4s;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.1); opacity: 0.8; }
        }

        #interactive-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Content Layout */
        .main-content {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1200px;
            padding: 2rem 5%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: fade-up 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo Area (Text Only) */
        .brand {
            margin-bottom: 6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--text-main);
        }

        .brand-subtitle {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(0.75rem, 2.5vw, 1.2rem);
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.2;
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Center Focus Area */
        .focus-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .typewriter-text {
            border-right: 3px solid var(--accent-cyan);
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            margin: 0 auto;
            padding-right: 4px;
            animation: blink-caret 0.75s step-end infinite;
        }

        @keyframes blink-caret {
            from, to { border-color: transparent; }
            50% { border-color: var(--accent-cyan); }
        }
        
        @keyframes charFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        .char-anim {
            opacity: 0;
            animation: charFadeIn 0.15s forwards;
        }

        h1 {
            font-size: clamp(1.8rem, 8vw, 5.5rem);
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            line-height: 1.3;
        }

        p {
            font-size: clamp(0.95rem, 4vw, 1.4rem);
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            font-weight: 400;
            padding: 0 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .brand {
                margin-bottom: 3rem;
            }
            h1 {
                letter-spacing: -1px;
            }
            .typewriter-text {
                border-right-width: 2px;
            }
        }

        /* Mobile Landscape & Short Screens */
        @media (max-height: 500px) {
            .main-content {
                padding: 2rem 5%;
            }
            .brand {
                margin-bottom: 1.5rem;
            }
            .logo {
                font-size: clamp(1.2rem, 5vh, 2rem);
            }
            h1 {
                font-size: clamp(1.5rem, 8vh, 3rem);
                margin-bottom: 0.5rem;
            }
            p {
                font-size: clamp(0.85rem, 4vh, 1.1rem);
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="bg-layer" id="bg-layer">
        <canvas id="interactive-grid"></canvas>
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Text Logo -->
        <div class="brand">
            <span class="logo">ArQbit</span>
            <span class="brand-subtitle">Technologies Pvt. Ltd.</span>
        </div>

        <div class="focus-area">
            <!-- Message -->
            <h1><span class="typewriter-text" id="typewriter"></span></h1>
            <p>Thank you for your interest. We are building something amazing and will launch soon.</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('interactive-grid');
            const ctx = canvas.getContext('2d');
            
            let width, height;
            let nodes = [];
            
            // Grid configuration
            const gridSize = 60; // Spacing between lines
            const influenceRadius = 250; // How far the cursor effect reaches
            const maxDisplacement = 40; // Max movement distance of a node
            const ease = 0.08; // Smoothness of node return
            
            // Mouse state
            let mouseX = -1000;
            let mouseY = -1000;
            let targetMouseX = -1000;
            let targetMouseY = -1000;
            
            // Typewriter Effect
            const typewriterEl = document.getElementById('typewriter');
            const textToType = "We're coming soon.";
            let typeIndex = 0;
            let typeSpeed = 45; // Faster for smoother effect

            function typeText() {
                if (typeIndex < textToType.length) {
                    const char = textToType.charAt(typeIndex);
                    const span = document.createElement('span');
                    span.textContent = char === ' ' ? '\u00A0' : char; // Preserve spaces
                    span.className = 'char-anim';
                    typewriterEl.appendChild(span);
                    typeIndex++;
                    setTimeout(typeText, typeSpeed + (Math.random() * 20)); // Subtle randomness
                }
            }
            
            // Start typing after a short delay
            setTimeout(typeText, 300);
            
            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                
                // Account for high DPI displays
                const dpr = window.devicePixelRatio || 1;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.scale(dpr, dpr);
                
                initGrid();
            }
            
            function initGrid() {
                nodes = [];
                // Calculate number of columns and rows with a bit of overflow to avoid edge clipping
                const cols = Math.ceil(width / gridSize) + 2;
                const rows = Math.ceil(height / gridSize) + 2;
                
                // Offset to center the grid
                const offsetX = (width - (cols - 1) * gridSize) / 2;
                const offsetY = (height - (rows - 1) * gridSize) / 2;
                
                for (let r = 0; r < rows; r++) {
                    const rowNodes = [];
                    for (let c = 0; c < cols; c++) {
                        const baseX = offsetX + c * gridSize;
                        const baseY = offsetY + r * gridSize;
                        rowNodes.push({
                            baseX: baseX,
                            baseY: baseY,
                            currentX: baseX,
                            currentY: baseY
                        });
                    }
                    nodes.push(rowNodes);
                }
            }
            
            window.addEventListener('resize', resize);
            
            window.addEventListener('mousemove', (e) => {
                targetMouseX = e.clientX;
                targetMouseY = e.clientY;
            });
            
            window.addEventListener('mouseleave', () => {
                // Move influence away when mouse leaves
                targetMouseX = -1000;
                targetMouseY = -1000;
            });
            
            function drawGrid() {
                // Clear canvas
                ctx.clearRect(0, 0, width, height);
                
                // Smoothly interpolate mouse position for fluid interaction
                mouseX += (targetMouseX - mouseX) * 0.15;
                mouseY += (targetMouseY - mouseY) * 0.15;
                
                const rows = nodes.length;
                const cols = rows > 0 ? nodes[0].length : 0;
                
                // Update node positions based on cursor proximity
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const node = nodes[r][c];
                        
                        let targetX = node.baseX;
                        let targetY = node.baseY;
                        
                        const dx = mouseX - node.baseX;
                        const dy = mouseY - node.baseY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        
                        // Calculate spatial distortion
                        if (dist < influenceRadius) {
                            // The closer to the cursor, the stronger the force (1 at center, 0 at edge)
                            const force = (influenceRadius - dist) / influenceRadius;
                            
                            // Prevent division by zero
                            const safeDx = dx === 0 && dy === 0 ? 0.01 : dx;
                            const safeDy = dx === 0 && dy === 0 ? 0.01 : dy;
                            const safeDist = dist === 0 ? 0.01 : dist;
                            
                            // Push node away from the cursor
                            targetX = node.baseX - (safeDx / safeDist) * force * maxDisplacement;
                            targetY = node.baseY - (safeDy / safeDist) * force * maxDisplacement;
                        }
                        
                        // Smoothly move current position towards target using easing
                        node.currentX += (targetX - node.currentX) * ease;
                        node.currentY += (targetY - node.currentY) * ease;
                    }
                }
                
                // Set line style to match the subtle ArQbit aesthetic
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.05)';
                ctx.lineWidth = 1;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                ctx.beginPath();
                
                // Draw horizontal lines connecting the nodes
                for (let r = 0; r < rows; r++) {
                    ctx.moveTo(nodes[r][0].currentX, nodes[r][0].currentY);
                    for (let c = 1; c < cols; c++) {
                        ctx.lineTo(nodes[r][c].currentX, nodes[r][c].currentY);
                    }
                }
                
                // Draw vertical lines connecting the nodes
                for (let c = 0; c < cols; c++) {
                    ctx.moveTo(nodes[0][c].currentX, nodes[0][c].currentY);
                    for (let r = 1; r < rows; r++) {
                        ctx.lineTo(nodes[r][c].currentX, nodes[r][c].currentY);
                    }
                }
                
                // Render the grid
                ctx.stroke();
                
                requestAnimationFrame(drawGrid);
            }
            
            // Initialization
            resize();
            drawGrid();
        });
    </script>
</body>
</html>
